name: Quick checks

on:
  push:
    branches: [main, test/full-integration]
  pull_request:
    branches: [main, test/full-integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quick-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Verify bootstrap / metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Repository CI — packwiz/mod index
        run: python3 scripts/validate_repo.py
      - name: Integration Preflight — local schema/source ownership, read-only
        run: python3 scripts/validate_integration.py
      - name: Progression path goals — research contract only
        run: python3 scripts/validate_progression_goals.py
      - name: Repository and preflight unit tests
        run: python3 -m unittest discover -s tests -v

# Deliberately does not download the mod roster, assemble donor streams,
# boot NeoForge, package Prism, publish artifacts or create releases.
